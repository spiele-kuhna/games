<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spiele</title>
    <style>
      /* Keine externen Schriften oder Skripte: die Seite lädt nichts von Drittanbietern. */
      :root { --bg: #f4f1ea; --text: #222; --card: #fff; --accent: #2e6b3a; --muted: #666; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1d1f1c; --text: #eee; --card: #2a2d29; --accent: #8fd19e; --muted: #aaa; }
      }
      body { margin: 0; background: var(--bg); color: var(--text);
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
      main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
      h1 { margin-top: 0; }
      a.spiel { display: block; background: var(--card); border-radius: 0.75rem; padding: 1rem 1.25rem;
                color: inherit; text-decoration: none; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
      a.spiel:hover, a.spiel:focus { outline: 2px solid var(--accent); }
      a.spiel strong { color: var(--accent); font-size: 1.25rem; }
      footer { margin-top: 3rem; font-size: 0.875rem; color: var(--muted); }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Spiele</h1>
      <a class="spiel" href="stadt/">
        <strong>Dorfplaner</strong><br>
        Plane und baue deine eigene Stadt – im Browser, am PC und auf dem iPad.
      </a>
      <footer>
        <p>Quellcode und Lizenzen: <a href="https://github.com/spiele-kuhna/games">github.com/spiele-kuhna/games</a></p>
        <p>[OFFEN: Link zum Impressum] · [OFFEN: Link zum Datenschutzhinweis]</p>
      </footer>
    </main>
  </body>
</html>
